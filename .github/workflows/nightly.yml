name: Nightly

# Every three hours: if main has a new commit with a green "CI passed" check
# that changes an app, build that app as `<next>-nightly.<UTC timestamp>` and
# publish it to the rolling pre-release `<app>-nightly` (its own update
# channel). Stable releases, `<app>-latest` and the website stay untouched.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'App ID (empty: every app with changes)'
        required: false
        default: ''
        type: string
      force:
        description: 'Build even without new changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Find new changes
    # Nightlies are always built from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: plan
        name: Pick the newest green commit and the apps it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node tooling/release/nightly-plan.mjs

  build-macos:
    name: Build ${{ matrix.app }} nightly (macOS)
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.app }}-macos
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Nightly version and icons
        run: node tooling/release/nightly-config.mjs "${{ matrix.app }}" "${{ matrix.version }}" "$RUNNER_TEMP/nightly.conf.json"
      - name: Build signed bundles
        working-directory: apps/${{ matrix.app }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_AGENTZ_BUILD_CHANNEL: nightly
          VITE_AGENTZ_BUILD_COMMIT: ${{ matrix.sha }}
          VITE_AGENTZ_BUILD_TIME: ${{ matrix.built_at }}
        run: pnpm exec tauri build --target aarch64-apple-darwin --config "$RUNNER_TEMP/nightly.conf.json" -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-nightly-macos
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build ${{ matrix.app }} nightly (Windows)
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.app }}-windows
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Nightly version and icons
        run: node tooling/release/nightly-config.mjs "${{ matrix.app }}" "${{ matrix.version }}" "$RUNNER_TEMP/nightly.conf.json"
      - name: Build signed installer
        working-directory: apps/${{ matrix.app }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_AGENTZ_BUILD_CHANNEL: nightly
          VITE_AGENTZ_BUILD_COMMIT: ${{ matrix.sha }}
          VITE_AGENTZ_BUILD_TIME: ${{ matrix.built_at }}
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --config "$RUNNER_TEMP/nightly.conf.json" -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-nightly-windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish ${{ matrix.app }} nightly
    needs: [plan, build-macos, build-windows]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    concurrency:
      group: nightly-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.app }}-nightly-*
          path: ${{ runner.temp }}/nightly-artifacts
      - name: Upload assets, then the updater manifest, then the release text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
          VERSION: ${{ matrix.version }}
          SHA: ${{ matrix.sha }}
          PREVIOUS: ${{ matrix.previous }}
          BUILT_AT: ${{ matrix.built_at }}
          ARTIFACTS: ${{ runner.temp }}/nightly-artifacts
        run: node tooling/release/nightly-publish.mjs
