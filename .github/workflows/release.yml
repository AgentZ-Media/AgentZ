name: Release

on:
  push:
    tags: ['*-v*.*.*']
  workflow_dispatch:
    inputs:
      app:
        description: 'App ID to build without publishing (for example scriptz)'
        required: true
        default: scriptz
        type: string

permissions:
  contents: read

# Re-running a tag must not race its own uploads. Different versions can build
# concurrently; their pointer publications are serialized separately below.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.app || 'tag' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate app and prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_id: ${{ steps.prepare.outputs.app_id }}
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release_id: ${{ steps.prepare.outputs.release_id }}
      dry_run: ${{ steps.prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: prepare
        name: Validate versions and notes; create non-latest release for tag events only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APP: ${{ inputs.app }}
        run: node tooling/release/prepare.mjs

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: prepare
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ needs.prepare.outputs.app_id }}-macos
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve completed platform assets on rerun
        id: guard
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PLATFORM: darwin-aarch64
        run: node tooling/release/platform-guard.mjs
      - name: Build and upload signed release assets
        if: needs.prepare.outputs.dry_run == 'false' && steps.guard.outputs.complete != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          projectPath: apps/${{ needs.prepare.outputs.app_id }}
          args: --target aarch64-apple-darwin -- --locked
      - name: Build only (no signing secrets, tag, release, or updater manifest)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/${{ needs.prepare.outputs.app_id }}
          includeUpdaterJson: false
          args: >-
            --target aarch64-apple-darwin
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
            -- --locked
      - name: Save dry-run bundles
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_id }}-macos-arm64-dry-run
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (x64)
    # tauri-action merges latest.json; concurrent platform uploads lose entries.
    needs: [prepare, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ needs.prepare.outputs.app_id }}-windows
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve completed platform assets on rerun
        id: guard
        if: needs.prepare.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PLATFORM: windows-x86_64
        run: node tooling/release/platform-guard.mjs
      - name: Build and upload signed release assets
        if: needs.prepare.outputs.dry_run == 'false' && steps.guard.outputs.complete != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          projectPath: apps/${{ needs.prepare.outputs.app_id }}
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc -- --locked
      - name: Build only (no signing secrets, tag, release, or updater manifest)
        if: needs.prepare.outputs.dry_run == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/${{ needs.prepare.outputs.app_id }}
          includeUpdaterJson: false
          args: >-
            --target x86_64-pc-windows-msvc
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
            -- --locked
      - name: Save dry-run bundles
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.app_id }}-windows-x64-dry-run
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-pointer:
    name: Publish app download and updater pointer
    needs: [prepare, build-macos, build-windows]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pointer-${{ needs.prepare.outputs.app_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify signed assets, protect against rollback, publish installers then manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node tooling/release/pointer.mjs
      # Signed-in apps check right away instead of hourly. Never fails the job,
      # also not for a tag that predates the script.
      - name: Announce the release to the apps
        continue-on-error: true
        env:
          CHANNEL: stable
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ANNOUNCE_TOKEN: ${{ secrets.RELEASE_ANNOUNCE_TOKEN }}
        run: |
          if [ -f tooling/release/announce.mjs ]; then node tooling/release/announce.mjs
          else echo "::warning::This tag has no announce script; apps find the release with their hourly check."; fi
