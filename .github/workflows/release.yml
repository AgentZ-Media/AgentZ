name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*.*'

permissions:
  contents: write

jobs:
  # ============================================================
  # 1) Prepare release notes
  # ============================================================
  # Reads the per-version changelog file + the static install footer
  # and passes them as a single output so both build jobs see the same
  # body. Aborts if the changelog file is missing - this way no release
  # can accidentally ship with the previous description.
  prepare-notes:
    name: Prepare release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build release body
        id: notes
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          FOOTER_FILE="docs/release-notes/_install_footer.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing $NOTES_FILE - create it before tagging (see /CLAUDE.md release-checklist)."
            exit 1
          fi
          if [ ! -f "$FOOTER_FILE" ]; then
            echo "::error::Missing $FOOTER_FILE."
            exit 1
          fi
          {
            echo "body<<EOF_RELEASE_BODY"
            cat "$NOTES_FILE"
            echo
            cat "$FOOTER_FILE"
            echo "EOF_RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2) macOS build (Apple Silicon)
  # ============================================================
  # Runs first and creates the GitHub release object, including the
  # initial `latest.json` with the darwin-aarch64 entry for the
  # auto-updater. Pinned to macos-26 (Tahoe) so the SDK matches what
  # users running Tahoe see locally.
  build-macos:
    name: Build macOS (Apple Silicon)
    needs: prepare-notes
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos

      - name: Setup pnpm
        # Version comes from packageManager in the repo-root package.json,
        # so local and CI use the same pnpm version. No value specified
        # here - otherwise the two sources collide (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing keys. Required so tauri-action emits the
          # signed `latest.json` manifest + `.app.tar.gz` bundle that the
          # in-app updater polls for. Set these as repo secrets:
          #   - TAURI_SIGNING_PRIVATE_KEY: contents of ~/.tauri/scriptz_updater.key
          #   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: password if the key has one
          #     (leave empty if generated with --no-password)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ScriptZ ${{ github.ref_name }}'
          releaseBody: ${{ needs.prepare-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin

  # ============================================================
  # 3) Windows build (x64 NSIS)
  # ============================================================
  # Runs AFTER the macOS build because tauri-action finds the existing
  # `latest.json` in the release and merges the windows-x86_64 entry
  # into the existing manifest. Running in parallel would cause the
  # two latest.json uploads to overwrite each other.
  # Visual Studio Build Tools + WebView2 are already preinstalled on
  # windows-latest - no extra setup needed.
  build-windows:
    name: Build Windows (x64)
    needs: [prepare-notes, build-macos]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tagName references the release that build-macos created.
          # tauri-action detects the existing release by tag name and
          # appends assets instead of creating a new one. `latest.json`
          # is merged: the existing darwin-aarch64 entry stays,
          # windows-x86_64 is added alongside.
          tagName: ${{ github.ref_name }}
          releaseName: 'ScriptZ ${{ github.ref_name }}'
          releaseBody: ${{ needs.prepare-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc
