[package]
name = "scriptz"
version = "0.8.4"
description = "ScriptZ - fast, local, beautiful script editor for short-form video creators (TikTok, Reels, YouTube Shorts)."
authors = ["ScriptZ Contributors"]
edition = "2021"

[lib]
name = "scriptz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = { version = "2.5.1", default-features = false }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Required by `tauri::generate_context!()` — the macro expands to code
# that references `serde_json` directly.
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
