[package]
name = "scriptz"
version = "0.10.1"
description = "ScriptZ - fast, local, beautiful script editor for short-form video creators (TikTok, Reels, YouTube Shorts)."
authors = ["AgentZ Media"]
edition = "2021"

[lib]
name = "scriptz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
agentz-desktop = { path = "../../../crates/agentz-desktop" }
tauri = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-sql = { workspace = true }

# Required by `tauri::generate_context!()` — the macro expands to code
# that references `serde_json` directly.
serde_json = { workspace = true }
